name: Cost Report

on:
  pull_request:
    paths:
      - '**.tf'
      - '**.tfvars'
      - '**.hcl'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Days of Cost Explorer history to pull'
        default: '90'
        required: false

permissions:
  contents: read
  pull-requests: write        # needed to post PR comment
  id-token: write             # needed for OIDC → AWS assume-role

jobs:
  cost-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history needed to check out the PR base ref below for the diff.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Install bucksawz
        run: |
          uv venv .venv
          source .venv/bin/activate
          uv pip install -e .

      - name: Set up Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Checkout PR base into a worktree
        if: github.event_name == 'pull_request'
        # A worktree, not a second checkout action, so this branch's checkout
        # (and any local changes actions/checkout leaves) is untouched.
        run: git worktree add /tmp/pr-base ${{ github.event.pull_request.base.sha }}

      - name: Generate base Infracost JSON
        if: github.event_name == 'pull_request'
        # Best-effort: a base whose Terraform infracost can't evaluate (bad
        # state, missing vars, first commit in the repo) shouldn't fail the
        # whole job — just fall back to a plain breakdown with no diff below.
        continue-on-error: true
        run: |
          infracost breakdown \
            --path /tmp/pr-base \
            --format json \
            --out-file infracost-base.json

      - name: Generate Infracost JSON
        run: |
          if [ -f infracost-base.json ]; then
            infracost diff \
              --path . \
              --format json \
              --compare-to infracost-base.json \
              --out-file infracost.json
          else
            infracost breakdown \
              --path . \
              --format json \
              --out-file infracost.json
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_COST_EXPLORER_ROLE_ARN }}
          aws-region: us-east-1
        # Optional: skip Cost Explorer enrichment if role not configured
        continue-on-error: true
        id: aws-auth

      - name: Enrich with AWS Cost Explorer actuals
        if: steps.aws-auth.outcome == 'success'
        run: |
          source .venv/bin/activate
          bucksawz enrich \
            --input infracost.json \
            --output enriched.json \
            --lookback-days ${{ github.event.inputs.lookback_days || '90' }} \
            --aws-region us-east-1

      - name: Generate HTML report
        run: |
          source .venv/bin/activate
          INPUT=$( [ -f enriched.json ] && echo enriched.json || echo infracost.json )
          bucksawz report --input "$INPUT" --output cost-report.html

      - name: Upload report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cost-report
          path: cost-report.html
          retention-days: 30

      - name: Post summary to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Parse totals from infracost JSON for the comment body. When the
            // base-branch breakdown succeeded, this file is `infracost diff`
            // output: each project carries a `diff` breakdown (per-resource
            // deltas) alongside the current `breakdown` — see
            // bucksawz/schema/infracost.py's Project.diff/past_breakdown,
            // which bucksawz report renders as a "Plan changes" section.
            let total = 'N/A';
            let projects = [];
            let diffTotal = null;
            try {
              const src = fs.existsSync('enriched.json') ? 'enriched.json' : 'infracost.json';
              const data = JSON.parse(fs.readFileSync(src, 'utf8'));
              total = data.totalMonthlyCost
                ? '$' + parseFloat(data.totalMonthlyCost).toLocaleString('en-US', {minimumFractionDigits: 2})
                : 'N/A';
              projects = (data.projects || []).map(p => ({
                name: p.name,
                cost: p.breakdown?.totalMonthlyCost ?? p.monthlyCost ?? null,
              }));
              const diffs = (data.projects || [])
                .map(p => p.diff?.totalMonthlyCost)
                .filter(v => v !== undefined && v !== null)
                .map(parseFloat);
              if (diffs.length) {
                diffTotal = diffs.reduce((a, b) => a + b, 0);
              }
            } catch (e) {}

            const rows = projects
              .filter(p => p.cost !== null)
              .sort((a, b) => parseFloat(b.cost) - parseFloat(a.cost))
              .slice(0, 15)
              .map(p => `| ${p.name} | $${parseFloat(p.cost).toFixed(2)} |`)
              .join('\n');

            let deltaLine = '';
            if (diffTotal !== null) {
              const sign = diffTotal > 0 ? '+' : diffTotal < 0 ? '-' : '';
              const arrow = diffTotal > 0 ? '📈' : diffTotal < 0 ? '📉' : '➡️';
              deltaLine = `**Change vs. base branch: ${arrow} ${sign}$${Math.abs(diffTotal).toFixed(2)}/mo**\n\n`;
            }

            const body = [
              '## 💰 Cost Report',
              '',
              `**Estimated monthly total: ${total}**`,
              '',
              deltaLine + '| Project | Monthly cost |',
              '|---------|-------------|',
              rows,
              '',
              `> Full interactive report — including the per-resource plan delta — attached as workflow artifact ([download](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})).`,
              `> Generated by [bucksawz](https://github.com/${{ github.repository }}).`,
            ].join('\n');

            // Find and update existing comment, or create new one
            const marker = '<!-- bucksawz-cost-report -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: marker + '\n' + body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: marker + '\n' + body,
              });
            }
