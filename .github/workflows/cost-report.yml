name: Cost Report

on:
  pull_request:
    paths:
      - '**.tf'
      - '**.tfvars'
      - '**.hcl'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Days of Cost Explorer history to pull'
        default: '90'
        required: false

permissions:
  contents: read
  pull-requests: write        # needed to post PR comment
  id-token: write             # needed for OIDC → AWS assume-role

jobs:
  cost-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Install bucksawz
        run: |
          uv venv .venv
          source .venv/bin/activate
          uv pip install -e .

      - name: Set up Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generate Infracost JSON
        run: |
          infracost breakdown \
            --path . \
            --format json \
            --out-file infracost.json

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_COST_EXPLORER_ROLE_ARN }}
          aws-region: us-east-1
        # Optional: skip Cost Explorer enrichment if role not configured
        continue-on-error: true
        id: aws-auth

      - name: Enrich with AWS Cost Explorer actuals
        if: steps.aws-auth.outcome == 'success'
        run: |
          source .venv/bin/activate
          bucksawz enrich \
            --input infracost.json \
            --output enriched.json \
            --lookback-days ${{ github.event.inputs.lookback_days || '90' }} \
            --aws-region us-east-1

      - name: Generate HTML report
        run: |
          source .venv/bin/activate
          INPUT=$( [ -f enriched.json ] && echo enriched.json || echo infracost.json )
          bucksawz report --input "$INPUT" --output cost-report.html

      - name: Upload report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cost-report
          path: cost-report.html
          retention-days: 30

      - name: Post summary to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Parse totals from infracost JSON for the comment body
            let total = 'N/A';
            let projects = [];
            try {
              const src = fs.existsSync('enriched.json') ? 'enriched.json' : 'infracost.json';
              const data = JSON.parse(fs.readFileSync(src, 'utf8'));
              total = data.totalMonthlyCost
                ? '$' + parseFloat(data.totalMonthlyCost).toLocaleString('en-US', {minimumFractionDigits: 2})
                : 'N/A';
              projects = (data.projects || []).map(p => ({
                name: p.name,
                cost: p.breakdown?.totalMonthlyCost ?? p.monthlyCost ?? null,
              }));
            } catch (e) {}

            const rows = projects
              .filter(p => p.cost !== null)
              .sort((a, b) => parseFloat(b.cost) - parseFloat(a.cost))
              .slice(0, 15)
              .map(p => `| ${p.name} | $${parseFloat(p.cost).toFixed(2)} |`)
              .join('\n');

            const body = [
              '## 💰 Cost Report',
              '',
              `**Estimated monthly total: ${total}**`,
              '',
              '| Project | Monthly cost |',
              '|---------|-------------|',
              rows,
              '',
              `> Full interactive report attached as workflow artifact ([download](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})).`,
              `> Generated by [bucksawz](https://github.com/${{ github.repository }}).`,
            ].join('\n');

            // Find and update existing comment, or create new one
            const marker = '<!-- bucksawz-cost-report -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: marker + '\n' + body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: marker + '\n' + body,
              });
            }
