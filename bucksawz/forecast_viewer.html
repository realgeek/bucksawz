<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bucksawz forecast</title>
<style>
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 14px;
  color: #111827;
  background: #f9fafb;
}
header {
  background: #1e293b;
  color: #f8fafc;
  padding: 1rem 1.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 0.75rem;
}
header h1 { font-size: 1.1rem; margin: 0; }
header .generated { font-size: 0.75rem; color: #94a3b8; }
main { max-width: 1100px; margin: 0 auto; padding: 1.5rem; }
.toolbar {
  display: flex;
  align-items: center;
  gap: 1.5rem;
  flex-wrap: wrap;
  margin-bottom: 1.25rem;
}
.toggle {
  display: inline-flex;
  border: 1px solid #d1d5db;
  border-radius: 6px;
  overflow: hidden;
}
.toggle button {
  border: none;
  background: #fff;
  padding: 0.5rem 1rem;
  font-size: 0.85rem;
  cursor: pointer;
  color: #374151;
}
.toggle button.active { background: #1e293b; color: #f8fafc; }
label.extrapolate {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  font-size: 0.85rem;
  color: #374151;
}
label.extrapolate input:disabled + span { color: #9ca3af; }
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 0.75rem;
  margin-bottom: 1.5rem;
}
.card {
  background: #fff;
  border: 1px solid #e5e7eb;
  border-radius: 8px;
  padding: 0.75rem 1rem;
}
.card .label { font-size: 0.72rem; color: #6b7280; text-transform: uppercase; letter-spacing: 0.06em; }
.card .value { font-size: 1.4rem; font-weight: 700; margin-top: 0.2rem; }
.card.green .value { color: #059669; }
.card.blue  .value { color: #2563eb; }
.card.amber .value { color: #d97706; }
table {
  width: 100%;
  border-collapse: collapse;
  background: #fff;
  border: 1px solid #e5e7eb;
  border-radius: 8px;
  overflow: hidden;
}
th, td {
  text-align: left;
  padding: 0.5rem 0.75rem;
  border-bottom: 1px solid #f1f5f9;
  font-size: 0.82rem;
}
th { background: #f8fafc; color: #6b7280; font-weight: 600; text-transform: uppercase; font-size: 0.68rem; letter-spacing: 0.05em; }
tr.new-resource { background: #fffbeb; }
.badge {
  display: inline-block;
  font-size: 0.68rem;
  padding: 0.1rem 0.4rem;
  border-radius: 4px;
  background: #fef3c7;
  color: #92400e;
  margin-left: 0.4rem;
}
.badge.estimated { background: #dbeafe; color: #1e40af; }
.na { color: #9ca3af; font-style: italic; }
.empty { padding: 2rem; text-align: center; color: #6b7280; }
.error { padding: 1rem 1.5rem; background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; border-radius: 8px; }
.gear-btn {
  background: none;
  border: 1px solid #475569;
  color: #f8fafc;
  border-radius: 6px;
  width: 2rem;
  height: 2rem;
  font-size: 1rem;
  line-height: 1;
  cursor: pointer;
}
.gear-btn:hover { background: #334155; }
.settings-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.5);
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 2rem 1rem;
  overflow-y: auto;
  z-index: 10;
}
.settings-panel {
  background: #fff;
  border-radius: 10px;
  max-width: 640px;
  width: 100%;
  padding: 1.5rem;
}
.settings-panel h2 { margin: 0 0 1rem; font-size: 1.05rem; }
.settings-panel h3 { font-size: 0.85rem; color: #6b7280; text-transform: uppercase; letter-spacing: 0.05em; margin: 1.5rem 0 0.5rem; }
.settings-panel .field { margin-bottom: 0.9rem; }
.settings-panel label { display: block; font-size: 0.8rem; color: #374151; margin-bottom: 0.25rem; }
.settings-panel input[type=text] {
  width: 100%;
  padding: 0.45rem 0.6rem;
  border: 1px solid #d1d5db;
  border-radius: 6px;
  font-size: 0.85rem;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
}
.settings-panel .hint { font-size: 0.72rem; color: #9ca3af; margin-top: 0.2rem; }
.settings-panel .row { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; margin-top: 1.25rem; }
.btn {
  border: none;
  border-radius: 6px;
  padding: 0.5rem 1rem;
  font-size: 0.85rem;
  cursor: pointer;
}
.btn-primary { background: #1e293b; color: #f8fafc; }
.btn-secondary { background: #f1f5f9; color: #374151; }
.btn:disabled { opacity: 0.6; cursor: default; }
.settings-status { font-size: 0.8rem; }
.settings-status.ok { color: #059669; }
.settings-status.err { color: #991b1b; }
.cache-table { width: 100%; font-size: 0.78rem; border-collapse: collapse; margin-top: 0.4rem; }
.cache-table th, .cache-table td { text-align: left; padding: 0.3rem 0.5rem; border-bottom: 1px solid #f1f5f9; }
.cache-summary { font-size: 0.8rem; color: #374151; }
.close-btn {
  float: right;
  background: none;
  border: none;
  font-size: 1.1rem;
  cursor: pointer;
  color: #6b7280;
}
</style>
</head>
<body>
<header>
  <h1>bucksawz forecast</h1>
  <div style="display:flex; align-items:center; gap:0.75rem;">
    <span class="generated" id="generated"></span>
    <button class="gear-btn" id="gear-btn" title="Settings" aria-label="Settings">&#9881;</button>
  </div>
</header>
<main id="app">
  <div class="empty">Loading&hellip;</div>
</main>
<div class="settings-overlay" id="settings-overlay" hidden>
  <div class="settings-panel">
    <button class="close-btn" id="settings-close" aria-label="Close">&times;</button>
    <h2>Forecast settings</h2>
    <div id="settings-body"><div class="empty">Loading&hellip;</div></div>
  </div>
</div>
<script>
(function () {
  const app = document.getElementById("app");
  const generatedEl = document.getElementById("generated");

  let payload = null;
  let view = "actual"; // "actual" | "proposed"
  let extrapolate = false;

  function fmtMoney(v) {
    if (v === null || v === undefined) return null;
    return "$" + Number(v).toFixed(2);
  }

  function summaryCards(output) {
    const s = output.summary || {};
    const items = [
      ["Total monthly cost", fmtMoney(output.totalMonthlyCost) || "$0.00", "blue"],
      ["Detected resources", s.totalDetectedResources || 0, ""],
      ["Estimated resources", s.totalSupportedResources || 0, "green"],
      ["Free resources", s.totalNoPriceResources || 0, ""],
      ["Unsupported", s.totalUnsupportedResources || 0, "amber"],
    ];
    const wrap = document.createElement("div");
    wrap.className = "cards";
    for (const [label, value, cls] of items) {
      const card = document.createElement("div");
      card.className = "card" + (cls ? " " + cls : "");
      const l = document.createElement("div");
      l.className = "label";
      l.textContent = label;
      const v = document.createElement("div");
      v.className = "value";
      v.textContent = value;
      card.append(l, v);
      wrap.append(card);
    }
    return wrap;
  }

  function resourceTotal(r) {
    // Mirrors Resource.total_monthly_cost() in schema/infracost.py: a
    // resource's own JSON only carries raw fields, not the derived total.
    if (r.monthlyCost !== null && r.monthlyCost !== undefined) return r.monthlyCost;
    let total = 0;
    for (const c of r.costComponents || []) {
      if (c.monthlyCost !== null && c.monthlyCost !== undefined) total += c.monthlyCost;
    }
    for (const sub of r.subresources || []) {
      total += resourceTotal(sub);
    }
    return total;
  }

  function newResourceLookup() {
    // { "project::name": {resourceType, extrapolatedMonthlyCost} }
    const map = {};
    for (const r of payload.newResources || []) {
      map[r.project + "::" + r.name] = r;
    }
    return map;
  }

  function resourceTable(output) {
    const newMap = view === "proposed" ? newResourceLookup() : {};
    const ceEstimates = view === "actual" ? (payload.actualEstimates || {}) : {};
    const table = document.createElement("table");
    const thead = document.createElement("thead");
    thead.innerHTML =
      "<tr><th>Project</th><th>Resource</th><th>Type</th><th>Monthly cost</th></tr>";
    const tbody = document.createElement("tbody");

    let rows = 0;
    for (const project of output.projects || []) {
      const resources = (project.breakdown && project.breakdown.resources) || [];
      for (const r of resources) {
        const key = project.name + "::" + r.name;
        const isNew = Object.prototype.hasOwnProperty.call(newMap, key);
        const tr = document.createElement("tr");
        if (isNew) tr.className = "new-resource";

        const tdProject = document.createElement("td");
        tdProject.textContent = project.name;
        const tdName = document.createElement("td");
        tdName.textContent = r.name;
        if (isNew) {
          const badge = document.createElement("span");
          badge.className = "badge";
          badge.textContent = "not yet deployed";
          tdName.append(badge);
        }
        const tdType = document.createElement("td");
        tdType.textContent = r.resourceType || "";

        const tdCost = document.createElement("td");
        if (isNew) {
          if (extrapolate) {
            const est = newMap[key].extrapolatedMonthlyCost;
            if (est === null || est === undefined) {
              tdCost.innerHTML = '<span class="na">no comparable deployed resource</span>';
            } else {
              tdCost.textContent = fmtMoney(est);
              const badge = document.createElement("span");
              badge.className = "badge estimated";
              badge.textContent = "estimated";
              tdCost.append(badge);
            }
          } else {
            tdCost.innerHTML = '<span class="na">not deployed</span>';
          }
        } else {
          const ceEst = Object.prototype.hasOwnProperty.call(ceEstimates, r.name) ? ceEstimates[r.name] : 0;
          tdCost.textContent = fmtMoney(resourceTotal(r) + ceEst) || "$0.00";
          if (ceEst) {
            const badge = document.createElement("span");
            badge.className = "badge estimated";
            badge.textContent = "CE actual";
            tdCost.append(badge);
          }
        }

        tr.append(tdProject, tdName, tdType, tdCost);
        tbody.append(tr);
        rows++;
      }
    }
    table.append(thead, tbody);
    if (rows === 0) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "No resources.";
      return empty;
    }
    return table;
  }

  function render() {
    app.innerHTML = "";

    const toolbar = document.createElement("div");
    toolbar.className = "toolbar";

    const toggle = document.createElement("div");
    toggle.className = "toggle";
    for (const [key, label] of [["actual", "Actual"], ["proposed", "Proposed"]]) {
      const btn = document.createElement("button");
      btn.textContent = label;
      if (key === view) btn.className = "active";
      btn.addEventListener("click", () => {
        view = key;
        render();
      });
      toggle.append(btn);
    }
    toolbar.append(toggle);

    const label = document.createElement("label");
    label.className = "extrapolate";
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = extrapolate;
    checkbox.disabled = view !== "proposed";
    checkbox.addEventListener("change", () => {
      extrapolate = checkbox.checked;
      render();
    });
    const span = document.createElement("span");
    span.textContent = "Extrapolate cost for not-yet-deployed resources";
    label.append(checkbox, span);
    toolbar.append(label);

    app.append(toolbar);

    const output = payload[view];
    app.append(summaryCards(output));
    app.append(resourceTable(output));
  }

  // --- Settings panel (gear icon): reads/writes forecast config and the
  // price cache via the small JSON API forecast_server.py adds on top of
  // plain static file serving (GET/POST /api/config, GET /api/cache,
  // POST /api/run). Fetched lazily, only when the panel is opened, so a
  // plain report view never depends on the API being present.

  const overlay = document.getElementById("settings-overlay");
  const settingsBody = document.getElementById("settings-body");

  function fieldRow(id, labelText, value, hint) {
    const field = document.createElement("div");
    field.className = "field";
    const label = document.createElement("label");
    label.htmlFor = id;
    label.textContent = labelText;
    const input = document.createElement("input");
    input.type = "text";
    input.id = id;
    input.value = value || "";
    field.append(label, input);
    if (hint) {
      const hintEl = document.createElement("div");
      hintEl.className = "hint";
      hintEl.textContent = hint;
      field.append(hintEl);
    }
    return field;
  }

  function cacheSection(cache) {
    const wrap = document.createElement("div");
    const h3 = document.createElement("h3");
    h3.textContent = "Price cache";
    wrap.append(h3);

    const summary = document.createElement("div");
    summary.className = "cache-summary";
    summary.textContent = cache.totalRows
      ? cache.totalRows + " rows cached at " + cache.path
      : "Empty (" + cache.path + ") -- run `bucksawz prices update`.";
    wrap.append(summary);

    if (cache.services && cache.services.length) {
      const table = document.createElement("table");
      table.className = "cache-table";
      table.innerHTML = "<thead><tr><th>Service</th><th>Region</th><th>Rows</th><th>Last fetched</th></tr></thead>";
      const tbody = document.createElement("tbody");
      for (const row of cache.services) {
        const tr = document.createElement("tr");
        tr.innerHTML =
          "<td>" + row.service + "</td><td>" + row.region + "</td><td>" + row.rows + "</td><td>" +
          (row.last_fetched ? String(row.last_fetched).slice(0, 19) : "") + "</td>";
        tbody.append(tr);
      }
      table.append(tbody);
      wrap.append(table);
    }
    return wrap;
  }

  async function loadSettings() {
    settingsBody.innerHTML = "";
    settingsBody.append(Object.assign(document.createElement("div"), { className: "empty", textContent: "Loading…" }));
    try {
      const [configResp, cacheResp] = await Promise.all([
        fetch("/api/config", { cache: "no-store" }),
        fetch("/api/cache", { cache: "no-store" }),
      ]);
      const config = await configResp.json();
      const cache = await cacheResp.json();

      settingsBody.innerHTML = "";
      const scope = document.createElement("div");
      scope.className = "hint";
      scope.textContent = config.repo
        ? `Editing repo "${config.repo}" -- saves go to its own section; blank optional fields fall back to the common settings.`
        : "Editing the common (top-level) settings.";
      settingsBody.append(scope);
      const h3commands = document.createElement("h3");
      h3commands.textContent = "Commands";
      settingsBody.append(h3commands);
      settingsBody.append(fieldRow("f-infra-dir", "Infra directory", config.infraDir,
        "Working directory the commands below run in (leave blank to use wherever `bucksawz serve` was started)."));
      settingsBody.append(fieldRow("f-region", "Region", config.region));
      settingsBody.append(fieldRow("f-actual", "Actual command", config.actualCommand,
        "Produces terraform show -json for what's currently deployed."));
      settingsBody.append(fieldRow("f-proposed", "Proposed command", config.proposedCommand,
        "Produces terraform show -json for the fully-deployed project."));
      settingsBody.append(fieldRow("f-ce", "Cost Explorer command (optional)", config.costExplorerCommand,
        "Outputs JSON usage data -- see forecast_config.py's docstring for the schema."));

      const row = document.createElement("div");
      row.className = "row";
      const saveBtn = document.createElement("button");
      saveBtn.className = "btn btn-primary";
      saveBtn.textContent = "Save settings";
      const runBtn = document.createElement("button");
      runBtn.className = "btn btn-secondary";
      runBtn.textContent = "Run forecast now";
      const status = document.createElement("span");
      status.className = "settings-status";
      row.append(saveBtn, runBtn, status);
      settingsBody.append(row);

      settingsBody.append(cacheSection(cache));

      function currentForm() {
        return {
          infraDir: document.getElementById("f-infra-dir").value,
          region: document.getElementById("f-region").value,
          actualCommand: document.getElementById("f-actual").value,
          proposedCommand: document.getElementById("f-proposed").value,
          costExplorerCommand: document.getElementById("f-ce").value,
        };
      }

      saveBtn.addEventListener("click", async () => {
        status.className = "settings-status";
        status.textContent = "Saving…";
        try {
          const resp = await fetch("/api/config", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(currentForm()),
          });
          if (!resp.ok) throw new Error("save failed (" + resp.status + ")");
          status.className = "settings-status ok";
          status.textContent = "Saved.";
        } catch (err) {
          status.className = "settings-status err";
          status.textContent = err.message;
        }
      });

      runBtn.addEventListener("click", async () => {
        runBtn.disabled = true;
        status.className = "settings-status";
        status.textContent = "Running… (this can take a while)";
        try {
          const resp = await fetch("/api/run", { method: "POST" });
          const result = await resp.json();
          if (!resp.ok || !result.ok) throw new Error(result.error || "run failed (" + resp.status + ")");
          status.className = "settings-status ok";
          status.textContent = "Forecast updated (" + result.path + "). Reloading…";
          await load();
          setTimeout(closeSettings, 800);
        } catch (err) {
          status.className = "settings-status err";
          status.textContent = err.message;
        } finally {
          runBtn.disabled = false;
        }
      });
    } catch (err) {
      settingsBody.innerHTML = "";
      const box = document.createElement("div");
      box.className = "error";
      box.textContent =
        "Couldn't load settings: " + err.message +
        ". The settings panel needs bucksawz serve's API, not a plain static file server.";
      settingsBody.append(box);
    }
  }

  function openSettings() {
    overlay.hidden = false;
    loadSettings();
  }

  function closeSettings() {
    overlay.hidden = true;
  }

  document.getElementById("gear-btn").addEventListener("click", openSettings);
  document.getElementById("settings-close").addEventListener("click", closeSettings);
  overlay.addEventListener("click", (e) => {
    if (e.target === overlay) closeSettings();
  });

  async function load() {
    try {
      const manifestResp = await fetch("bucksawz_manifest.json", { cache: "no-store" });
      if (!manifestResp.ok) throw new Error("could not read bucksawz_manifest.json (" + manifestResp.status + ")");
      const manifest = await manifestResp.json();

      const dataResp = await fetch(manifest.latest, { cache: "no-store" });
      if (!dataResp.ok) throw new Error("could not read " + manifest.latest + " (" + dataResp.status + ")");
      payload = await dataResp.json();

      generatedEl.textContent = payload.generatedAt ? "Generated " + payload.generatedAt : "";
      render();
    } catch (err) {
      app.innerHTML = "";
      const box = document.createElement("div");
      box.className = "error";
      box.textContent =
        "Couldn't load forecast data: " + err.message +
        ". This page must be served over http(s) (e.g. `bucksawz serve`), not opened directly from disk.";
      app.append(box);
    }
  }

  load();
})();
</script>
</body>
</html>
