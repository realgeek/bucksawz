[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bucksawz"
version = "0.1.0"
description = "Cloud cost reporting and estimation — a liberally-licensed Infracost successor"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "jinja2>=3.1",
    "click>=8.1",
    "pyyaml>=6.0",
]

[project.scripts]
bucksawz = "bucksawz.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["bucksawz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
